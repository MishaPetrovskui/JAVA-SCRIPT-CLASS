<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <script src="script.js"></script>
</head>
<body>
    <button onclick="let first = Number(prompt('Enter number')); alert(first+'^2 = '+one(first))">1</button>
    <button onclick="let second = prompt('Enter numbers for space').split(' '); alert('AVG: '+second[0]+', '+second[1]+' - '+two(second))">2</button>
    <button onclick="let third = Number(prompt('Enter length of square')); alert('S=a^2 -> S='+third+'^2 = '+three(third))">3</button>
    <button onclick="let fourth = Number(prompt('Enter kilomiters')); alert(fourth+'kilomiters ->'+four(fourth)+'miles')">4</button>
    <button onclick="let fifth = prompt('Enter numbers for space').split(' '); five(fifth)">5</button>
    <button onclick="let sixth = prompt('Enter numbers for space').split(' '); six(sixth)">6</button>
    <button onclick="let seventh = prompt('Enter time for space').split(' '); seven(seventh)">7</button>
    <button>8</button>
    <button>9</button>
    <button>10</button>
</body>
</html>
